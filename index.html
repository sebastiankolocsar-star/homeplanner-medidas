<body>

<!-- INICIO: lista de obras -->
<section id="inicio" class="view">
  <div class="top">
    <div class="logo"><b>home</b><span>planner</span><small>INTERIOR FITTINGS</small></div>
    <button class="iconbtn" id="btnAjustes" aria-label="Ajustes"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="5" cy="12" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="19" cy="12" r="1.4"/></svg></button>
  </div>
  <div class="scroll">
    <div class="seccion"><h2>Obras</h2><span class="muted" id="numObras"></span></div>
    <div id="listaObras"></div>
    <div id="avisoInstalar" class="aviso hidden">Para usarla <b>sin internet</b>: en Safari pulsa <b>Compartir</b> y luego <b>Añadir a pantalla de inicio</b>. Ábrela siempre desde ese icono.</div>
  </div>
  <button class="btn fab" id="btnNuevaObra"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M12 5v14M5 12h14"/></svg>Nueva obra</button>
</section>

<!-- OBRA -->
<section id="obra" class="view hidden">
  <div class="top">
    <button class="iconbtn" id="btnVolverObra" aria-label="Volver"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 5l-7 7 7 7"/></svg></button>
    <h1 id="obraNombre"></h1>
    <button class="iconbtn" id="btnMenuObra" aria-label="Opciones"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="5" cy="12" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="19" cy="12" r="1.4"/></svg></button>
  </div>
  <div class="scroll">
    <div class="muted" id="obraDatos" style="margin-top:12px"></div>
    <div id="obraOD"></div>

    <div class="seccion"><h2>Fotos</h2><span class="muted" id="numFotos"></span></div>
    <div class="fila" style="margin-bottom:14px">
      <button class="btn" id="btnCamara"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>Hacer foto</button>
      <button class="btn sec" id="btnGaleria"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 16l5-5 5 5 3-3 5 5"/></svg>Galería</button>
    </div>
    <input type="file" id="inCamara" accept="image/*" capture="environment" class="hidden">
    <input type="file" id="inGaleria" accept="image/*" multiple class="hidden">
    <div class="grid" id="gridFotos"></div>
    <button class="btn sec" id="btnPdf" style="width:100%;margin-top:14px"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 3h9l4 4v14H6z"/><path d="M14 3v5h5M9 13h7M9 17h5"/></svg>Crear PDF de la obra</button>

    <div class="seccion"><h2>Notas de voz</h2></div>
    <div id="zonaGrabar"></div>
    <div id="listaAudios"></div>

    <div class="seccion"><h2>Notas</h2></div>
    <textarea class="notas" id="obraNotas" placeholder="Escribe aquí ideas, detalles del cliente…"></textarea>
  </div>
</section>

<!-- EDITOR DE FOTO -->
<section id="editor" class="view hidden">
  <div class="top">
    <button class="iconbtn" id="btnCerrarEditor" aria-label="Volver"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 5l-7 7 7 7"/></svg></button>
    <input id="tituloFoto" placeholder="Título de la foto" maxlength="60">
    <button class="iconbtn" id="btnMenuFoto" aria-label="Opciones"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.8"><circle cx="5" cy="12" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="19" cy="12" r="1.4"/></svg></button>
    <button class="iconbtn" id="btnCompartir" aria-label="Compartir"><svg viewBox="0 0 24 24" fill="none" stroke-width="2"><path d="M12 3v12M7 8l5-5 5 5"/><path d="M5 12v8h14v-8"/></svg></button>
  </div>
  <div id="lienzoWrap">
    <canvas id="lienzo"></canvas>
    <div id="pista"></div>
    <div id="selBar" class="hidden">
      <button id="selMedida" class="amar">Medida</button>
      <button id="selBorrar">Borrar</button>
      <button id="selOk">Listo</button>
    </div>
  </div>
  <div class="barra">
    <div class="modo">
      <button id="modoAuto" class="on">Auto</button>
      <button id="modoLibre">Libre</button>
    </div>
    <div class="esp"></div>
    <button class="iconbtn" id="btnDeshacer" aria-label="Deshacer"><svg viewBox="0 0 24 24" fill="none" stroke-width="2"><path d="M9 14L4 9l5-5"/><path d="M4 9h11a5 5 0 010 10h-3"/></svg></button>
    <button class="iconbtn" id="btnAjustar" aria-label="Ver entera"><svg viewBox="0 0 24 24" fill="none" stroke-width="2"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
  </div>
</section>

<input type="file" id="inImportar" accept=".json,application/json" class="hidden">
<div id="modalRaiz"></div>
<audio id="reproductor" playsinline class="hidden"></audio>
